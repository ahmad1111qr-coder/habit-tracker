<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>متعقب العادات + خطة ٩٠ يوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     ATLAS — a ledger for habits.
     Ink & paper studio system. One signal color, used on purpose.
     ============================================================ */
  :root {
    --bg: #121110;              /* ink */
    --surface: #1C1A17;         /* paper */
    --surface2: #23201B;        /* paper, one shade up */
    --border: #35302A;          /* hairline */
    --text: #F2EDE2;            /* bone */
    --text-muted: #948C7E;      /* stone */
    --text-dim: #625C52;        /* stone, dimmer — labels & eyebrows */
    --gold: #FF4B23;            /* SIGNAL — the one unexpected accent */
    --gold-dim: rgba(255,75,35,0.12);
    --teal: #7C8467;            /* moss — muted secondary */
    --rust: #8A4636;            /* brick — muted secondary, warnings */

    --serif: 'El Messiri', serif;
    --sans: 'IBM Plex Sans Arabic', sans-serif;
    --mono: 'IBM Plex Mono', monospace;

    --edge: clamp(20px, 5vw, 56px);
    --hero: clamp(3rem, 10vw, 5.6rem);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  body { min-height: 100vh; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--gold); color: var(--bg); }

  .wrap { max-width: 900px; margin: 0 auto; padding: 18px var(--edge) 130px; position: relative; }

  .wrap::before {
    content: "ATLAS — HABIT LEDGER";
    position: fixed; top: 50%; inset-inline-end: 10px; transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl; font-family: var(--mono); font-size: 10px; letter-spacing: .28em;
    color: var(--text-dim); pointer-events: none; z-index: 1; display: none;
  }
  @media (min-width: 860px) { .wrap::before { display: block; } }

  h2, .page-title, .month-title, .reward-goal, .s-title, .b-title,
  .header .hero .num, .points-value, .habit-info .name, .goal-item .g-body b {
    font-family: var(--serif); font-weight: 700; letter-spacing: -0.01em;
  }
  .corner-total, .today-points b, .habit-time, .cal-day, .h-item, .h-item .d,
  .penalty-note, .sub-heading, .tab-index, .field label, .points-est,
  .habit-info .rate, .g-time, .g-place, .habit-info .tag {
    font-family: var(--mono);
  }

  @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes drift-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: no-preference) {
    .header .hero .num { animation: reveal .9s cubic-bezier(.16,1,.3,1) both; }
    .section { animation: drift-up .5s ease both; }
    .section:nth-of-type(2) { animation-delay: .06s; }
    .section:nth-of-type(3) { animation-delay: .12s; }
  }

  .tabbar {
    position: sticky; top: 0; z-index: 20; background: rgba(18,17,16,0.9); backdrop-filter: blur(8px);
    display: flex; gap: clamp(6px, 3vw, 26px); overflow-x: auto; padding: 16px 0 13px;
    margin: 0 calc(var(--edge) * -1) 44px; padding-inline: var(--edge); border-bottom: 1px solid var(--border);
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex: 0 0 auto; background: none; border: none; color: var(--text-muted); font-family: var(--sans);
    font-size: 13px; font-weight: 500; display: flex; align-items: baseline; gap: 7px; cursor: pointer;
    padding: 4px 1px 11px; border-bottom: 2px solid transparent; white-space: nowrap; transition: color .2s ease, border-color .2s ease;
  }
  .tab-btn .tab-icon, .tab-index { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-color: var(--gold); }
  .tab-btn.active .tab-index { color: var(--gold); }

  .header { position: relative; padding: 4px 0 36px; margin-bottom: 44px; border-bottom: 1px solid var(--border); }
  .header .eyebrow { display: flex; align-items: center; justify-content: space-between; font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 26px; }
  .corner-total { position: static; background: none; border: none; padding: 0; color: var(--gold); font-weight: 600; }
  .header .date { color: var(--text-muted); font-size: 14px; }
  .header .hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 26px; }
  .header .hero .num { color: var(--text); font-size: var(--hero); line-height: .92; font-weight: 800; }
  .header .hero .num.neg { color: var(--rust); }
  .header .hero .label { color: var(--text-muted); font-size: 13.5px; max-width: 220px; line-height: 1.6; padding-inline-end: 18px; border-inline-end: 1px solid var(--border); padding-bottom: 8px; }
  .header .today-points { margin-top: 22px; color: var(--text-muted); font-size: 12.5px; font-family: var(--mono); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .header .today-points::before { content: ''; width: 6px; height: 6px; background: var(--gold); flex-shrink: 0; }
  .header .today-points b { color: var(--text); font-size: 14.5px; }
  .header .today-points b.neg { color: var(--rust); }

  h2 { font-size: clamp(1.05rem, 3vw, 1.3rem); margin: 0; }
  .page-title { font-size: clamp(1.7rem, 6vw, 2.4rem); margin: 0 0 30px; }
  .section { margin-bottom: 56px; }
  .row-between { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
  .link-btn { background: none; border: none; color: var(--text); font-family: var(--sans); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 0 0 2px; border-bottom: 1px solid var(--gold); transition: opacity .2s; }
  .link-btn:hover { opacity: .75; }
  .link-btn.rust { border-color: var(--rust); }
  .muted-btn { background: none; border: none; color: var(--text-muted); font-family: var(--mono); font-size: 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 0 0 2px; border-bottom: 1px dashed var(--border); }
  .muted-btn:hover { color: var(--text); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 20px clamp(16px, 4vw, 26px); }
  .add-form { display: flex; flex-wrap: wrap; gap: 18px; align-items: end; margin-bottom: 16px; }
  .field { flex: 1; min-width: 140px; }
  .field.small { flex: none; width: 128px; }
  .field.mid { flex: none; width: 170px; }
  .field label { display: block; color: var(--text-dim); font-size: 10.5px; letter-spacing: .1em; margin-bottom: 7px; }
  .field input, .field select {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text);
    border-radius: 0; padding: 8px 2px; font-family: var(--sans); font-size: 14px; outline: none; transition: border-color .2s;
  }
  .field input:focus, .field select:focus { border-color: var(--gold); }
  .field select { background: var(--surface); }
  .btn-solid { background: var(--gold); color: var(--bg); border: none; border-radius: 2px; padding: 11px 20px; font-family: var(--sans); font-weight: 700; font-size: 13.5px; cursor: pointer; transition: transform .15s ease, opacity .15s ease; }
  .btn-solid:hover { transform: translateY(-1px); opacity: .92; }
  .btn-outline { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 2px; padding: 11px 20px; font-family: var(--sans); font-size: 13.5px; cursor: pointer; transition: border-color .2s, color .2s; }
  .btn-outline:hover { border-color: var(--text); color: var(--text); }
  .btn-teal { background: var(--teal); color: var(--bg); border: none; border-radius: 2px; padding: 11px 20px; font-family: var(--sans); font-weight: 700; font-size: 13.5px; cursor: pointer; transition: transform .15s ease; }
  .btn-teal:hover:not(:disabled) { transform: translateY(-1px); }
  .btn-teal:disabled { background: var(--surface2); color: var(--text-dim); cursor: default; }
  .btn-rust { background: none; border: 1px solid var(--rust); color: var(--rust); border-radius: 2px; padding: 9px 16px; font-family: var(--sans); font-weight: 700; font-size: 12.5px; cursor: pointer; }

  .habit-row { display: flex; align-items: center; gap: 14px; padding: 15px 2px; border-bottom: 1px solid var(--border); transition: background .2s ease; }
  .habit-row:hover { background: var(--surface2); }
  .dot { width: 6px; height: 6px; border-radius: 1px; flex-shrink: 0; }
  .habit-info { flex: 1; min-width: 0; }
  .habit-info .name { font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .habit-info .rate { color: var(--text-muted); font-size: 11px; }
  .habit-info .tag { display: inline-block; margin-inline-start: 6px; font-size: 9.5px; background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 1px 6px; border-radius: 2px; }
  .habit-time { font-variant-numeric: tabular-nums; font-size: 13.5px; width: 64px; text-align: left; color: var(--text-muted); }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: none; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 15px; transition: all .2s ease; }
  .icon-btn.play { border-color: var(--gold); color: var(--gold); }
  .icon-btn.play:hover { background: var(--gold); color: var(--bg); }
  .icon-btn.stop { background: var(--gold); border-color: var(--gold); color: var(--bg); }
  .icon-btn.del { border-color: transparent; color: var(--text-dim); }
  .icon-btn.del:hover { color: var(--rust); }
  .empty { color: var(--text-dim); font-size: 13.5px; text-align: center; padding: 26px 0; font-family: var(--mono); }

  .month-block { margin-bottom: 26px; }
  .month-title { font-size: 15px; color: var(--text); margin-bottom: 10px; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; font-size: 9.5px; letter-spacing: .04em; color: var(--text-dim); text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell { aspect-ratio: 1; border-radius: 2px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .cal-cell.empty-cell { border: none; }
  .cal-day { font-weight: 600; font-size: 11px; }
  .cal-stars { color: var(--gold); font-size: 9px; font-weight: 600; }
  .cal-cell.minus { border-color: var(--rust); }
  .cal-cell.minus .cal-stars { color: var(--rust); }

  .reward-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .reward-goal { display: flex; align-items: center; gap: 8px; font-size: 17px; }
  .progress-bar { background: var(--border); height: 2px; border-radius: 0; overflow: visible; margin-bottom: 20px; position: relative; }
  .progress-fill { background: var(--gold); height: 100%; position: relative; transition: width .4s ease; }
  .progress-fill::after { content: ''; position: absolute; top: 50%; inset-inline-end: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); transform: translateY(-50%); }
  .points-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .points-label { color: var(--text-dim); font-size: 10.5px; letter-spacing: .08em; font-family: var(--mono); }
  .points-value { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .points-value.neg { color: var(--rust); }
  .points-est { color: var(--text-muted); font-size: 11.5px; }
  .history { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 14px; }
  .history .h-title { color: var(--text-dim); font-size: 10.5px; letter-spacing: .1em; margin-bottom: 10px; font-family: var(--mono); }
  .history .h-item { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; gap: 10px; }
  .history .h-item .d { color: var(--text-dim); }

  .streak-card { margin-bottom: 26px; }
  .streak-card .s-title { display: flex; align-items: center; gap: 9px; font-size: 15.5px; margin-bottom: 4px; }
  .streak-card .s-sub { color: var(--text-dim); font-size: 11.5px; margin-bottom: 12px; font-family: var(--mono); }
  .streak-card svg text { font-family: var(--mono); }

  .goal-sentence { line-height: 2.6; font-size: 15px; margin-bottom: 16px; color: var(--text-muted); }
  .goal-sentence input { background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--gold); font-family: var(--serif); font-weight: 700; border-radius: 0; padding: 4px 6px; outline: none; font-size: 15px; }
  .goal-sentence input:focus { border-color: var(--gold); }
  .goal-sentence input#goal-habit { width: 150px; }
  .goal-sentence input#goal-place { width: 130px; }
  .goal-sentence input#goal-time { width: 120px; color: var(--text); font-family: var(--mono); }
  .notif-status { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; font-size: 12.5px; color: var(--text-muted); font-family: var(--mono); gap: 10px; }
  .notif-status b { color: var(--text); }
  .goal-item { display: flex; align-items: flex-start; gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--border); }
  .goal-item .g-icon { color: var(--gold); font-size: 14px; margin-top: 5px; }
  .goal-item .g-body { flex: 1; min-width: 0; font-size: 14px; line-height: 1.7; }
  .goal-item .g-body .g-time { color: var(--gold); }
  .goal-item .g-body .g-place { color: var(--teal); }

  .primary-progress { margin-top: 10px; width: 100%; }
  .penalty-note { font-size: 11px; color: var(--text-muted); letter-spacing: .01em; }
  .tag.primary-tag { border-color: var(--gold); color: var(--gold); }
  .banner-card { border: 1px solid var(--border); border-radius: 2px; padding: 15px 18px; margin-bottom: 18px; position: relative; padding-inline-start: 24px; }
  .banner-card::before { content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 3px; }
  .banner-card.warn::before { background: var(--gold); }
  .banner-card.ok::before { background: var(--teal); }
  .banner-card .b-title { font-size: 15px; margin-bottom: 5px; }
  .sub-heading { font-size: 10.5px; letter-spacing: .18em; color: var(--text-dim); margin: 32px 0 16px; display: flex; align-items: center; gap: 12px; font-family: var(--mono); }
  .sub-heading::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ---------- 90-day plan ---------- */
  .plan-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
  .plan-daynum { font-family: var(--serif); font-weight: 800; font-size: clamp(2.3rem, 8vw, 3.4rem); line-height: .95; }
  .plan-daynum small { font-family: var(--mono); font-weight: 400; font-size: 13px; color: var(--text-muted); margin-inline-start: 8px; }
  .plan-phase { color: var(--text-muted); font-size: 13px; line-height: 1.7; max-width: 320px; }
  .plan-phase b { color: var(--text); font-family: var(--serif); font-size: 14.5px; display: block; }
  .plan-nav { display: flex; align-items: center; gap: 8px; }
  .plan-nav button { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 2px; min-width: 38px; height: 34px; cursor: pointer; font-size: 13px; font-family: var(--mono); padding: 0 10px; }
  .plan-nav button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .plan-nav button:disabled { color: var(--text-dim); cursor: default; }
  .plan-meta { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .plan-meta b { color: var(--text); }
  .phase-strip { display: flex; gap: 3px; margin-bottom: 26px; }
  .phase-strip span { flex: 1; height: 3px; background: var(--border); }
  .phase-strip span.on { background: var(--teal); }
  .phase-strip span.now { background: var(--gold); }
  .task-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s ease; }
  .task-row:hover { background: var(--surface2); }
  .task-box { width: 19px; height: 19px; border: 1px solid var(--border); border-radius: 2px; flex-shrink: 0; margin-top: 3px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--bg); }
  .task-row.done .task-box { background: var(--teal); border-color: var(--teal); }
  .task-row.done .task-text { color: var(--text-dim); text-decoration: line-through; }
  .task-text { flex: 1; font-size: 14.5px; line-height: 1.6; }
  .task-pts { font-family: var(--mono); font-size: 11.5px; color: var(--gold); flex-shrink: 0; margin-top: 5px; }
  .task-row.done .task-pts { color: var(--teal); }
  .day-flag { border: 1px solid var(--border); border-inline-start: 3px solid var(--gold); border-radius: 2px; padding: 14px 18px; margin-bottom: 20px; font-size: 13.5px; line-height: 1.7; color: var(--text-muted); }
  .day-flag b { color: var(--text); font-family: var(--serif); font-size: 15px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   خطة ٩٠ يوم — أكاديمية التداول
   كل يوم مقسوم لمهام صغيرة وسهلة، كل مهمة إلها نقاط.
   ============================================================ */
const PLAN_MONTHS = [
  { n: 1, from: 1,  to: 28, title: 'الشهر الأول — كسر حاجز البونص وإطلاق المسابقة', goal: 'طُعم جديد بدل البونص المنتهي، وأول تواصل حقيقي مع القائمة.' },
  { n: 2, from: 29, to: 56, title: 'الشهر الثاني — إكمال الكورس وختام المسابقة', goal: 'تحويل متابعي المسابقة لمتعلمين فعليين، وختام يبني ولاء.' },
  { n: 3, from: 57, to: 90, title: 'الشهر الثالث — التثبيت والنمو', goal: 'تحسين التصميم، تنظيم مصادر الدخل، وتقييم شامل.' },
];

const PLAN_WEEKS = [
  { n: 1,  from: 1,  to: 7,  title: 'إصلاحات تقنية + محتوى تعريفي جديد' },
  { n: 2,  from: 8,  to: 14, title: 'بناء بوابة المسابقة' },
  { n: 3,  from: 15, to: 21, title: 'الإطلاق الرسمي للمسابقة' },
  { n: 4,  from: 22, to: 28, title: 'بناء الزخم + بداية الكورس' },
  { n: 5,  from: 29, to: 35, title: 'استمرار الزخم' },
  { n: 6,  from: 36, to: 42, title: 'ختام المسابقة' },
  { n: 7,  from: 43, to: 49, title: 'إكمال الكورس' },
  { n: 8,  from: 50, to: 56, title: 'تثبيت العادة' },
  { n: 9,  from: 57, to: 63, title: 'تحسين التصميم' },
  { n: 10, from: 64, to: 70, title: 'الفيديوهات الخاصة وتوسيع البروكرات' },
  { n: 11, from: 71, to: 77, title: 'تنظيم مصادر الدخل' },
  { n: 12, from: 78, to: 84, title: 'دفعة نمو أخيرة' },
  { n: 13, from: 85, to: 90, title: 'التقييم النهائي' },
];

/* ثوابت بتتكرر كل يوم — صغيرة وسريعة، هدفها تثبيت الإيقاع */
const PLAN_ANCHORS = [
  ['اقرأ مهام اليوم قبل ما تبدأ واختر من وين تبلّش', 5],
  ['اشتغل ٦٠ دقيقة متواصلة والموبايل بغرفة تانية', 20],
  ['رد على تعليقات ورسائل المتابعين', 10],
  ['سجّل رقم اليوم بسطر واحد (تسجيلات / تفاعل / حسابات)', 5],
  ['حدد أول مهمة لبكرة قبل ما تنام', 5],
];

/* مهام كل يوم: [النص، النقاط] */

function planMonthOf(day) { return PLAN_MONTHS.find(m => day >= m.from && day <= m.to) || PLAN_MONTHS[0]; }
function planWeekOf(day) { return PLAN_WEEKS.find(w => day >= w.from && day <= w.to) || PLAN_WEEKS[0]; }
function planTasksFor(day) {
  const d = PLAN_DAYS[day] || { f: '', t: [] };
  const anchors = PLAN_ANCHORS.map((a, i) => ({ id: 'a' + i, text: a[0], pts: a[1] }));
  const tasks = d.t.map((t, i) => ({ id: 't' + i, text: t[0], pts: t[1] }));
  return { focus: d.f, anchors, tasks };
}
const KEY = 'habitTrackerV2';
const SERIES_COLORS = ['#FF4B23', '#C7A467', '#7C8467', '#8A4636', '#A69C8C', '#5B6B73'];

function pad(n) { return String(n).padStart(2, '0'); }
function localDateStr(d = new Date()) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function daysBetween(aStr, bStr) {
  const a = new Date(aStr + 'T00:00:00'), b = new Date(bStr + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
/* الوقت ممكن يصير بالسالب — وقت العادات السلبية بينخصم من وقت اليوم */
function formatDuration(totalSeconds) {
  const neg = totalSeconds < 0;
  const s = Math.abs(Math.trunc(totalSeconds));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const body = h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
  return (neg ? '-' : '') + body;
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function defaultData() {
  return {

      secondaryName: 'مكافأة قريبة', secondaryAmount: 10, secondaryHistory: [],

}

let state = load();
let activeTab = 'habits';
let addingHabit = false;
let addingNegative = false;
let editingReward = false;
let editingDailyGoal = false;
let planViewDay = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultData();
    const p = JSON.parse(raw);
    p.negativeHabits = p.negativeHabits || [];
    p.negativeLogs = p.negativeLogs || {};
    p.totalPointsAllTime = typeof p.totalPointsAllTime === 'number' ? p.totalPointsAllTime : 0;
    p.logs = p.logs || {};
    p.activeTimers = p.activeTimers || {};
    p.goals = p.goals || [];
    p.reward = p.reward || {};
    p.reward.goalName = p.reward.goalName || 'كيس ملاكمة';
    p.reward.targetAmount = p.reward.targetAmount || 50;
    p.reward.pointBalance = typeof p.reward.pointBalance === 'number' ? p.reward.pointBalance : 0;
    p.reward.dollarBalance = p.reward.dollarBalance || 0;
    p.reward.pointsPerDollar = p.reward.pointsPerDollar || 100;
    p.reward.dailyGoalPoints = p.reward.dailyGoalPoints || 50;
    p.reward.history = p.reward.history || [];
    p.reward.secondaryName = p.reward.secondaryName || 'مكافأة قريبة';
    p.reward.secondaryAmount = typeof p.reward.secondaryAmount === 'number' ? p.reward.secondaryAmount : 10;
    p.reward.secondaryHistory = p.reward.secondaryHistory || [];
    p.plan = p.plan || { startDate: null, done: {} };
    p.plan.done = p.plan.done || {};
    p.lastPenaltyCheckDate = p.lastPenaltyCheckDate || localDateStr();
    p.penaltyLog = p.penaltyLog || [];
    p.habits = (p.habits || []).map(h => ({ type: 'recurring', category: 'secondary', minMinutes: 0, penalty: 0, createdAt: Date.now(), ...h }));
    p.negativeHabits = (p.negativeHabits || []).map(h => {
      const rate = h.rate !== undefined ? h.rate : (h.penalty !== undefined ? h.penalty : 5);
      return { type: 'recurring', createdAt: Date.now(), ...h, rate };
    });
    return p;
  } catch (e) { return defaultData(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function pruneTemporary() {
  const cutoff = 24 * 3600 * 1000;
  const now = Date.now();
  const bp = state.habits.length, bn = state.negativeHabits.length;
  state.habits = state.habits.filter(h => !(h.type === 'temporary' && (now - h.createdAt) > cutoff));
  state.negativeHabits = state.negativeHabits.filter(h => !(h.type === 'temporary' && (now - h.createdAt) > cutoff));
  if (state.habits.length !== bp || state.negativeHabits.length !== bn) save();
}

/* ---------- المهام الرئيسية: خصم يومي عند عدم الوصول للحد الأدنى ---------- */
function applyPrimaryPenaltiesForDay(dStr) {
  state.habits.forEach(h => {
    if (h.category !== 'primary' || !h.minMinutes) return;
    const createdDateStr = localDateStr(new Date(h.createdAt));
    if (createdDateStr >= dStr) return;
    const secs = (state.logs[dStr] && state.logs[dStr][h.id]) || 0;
    const minutesDone = secs / 60;
    if (minutesDone < h.minMinutes) {
      const penalty = h.penalty || 0;
      if (penalty > 0) {
        state.reward.pointBalance -= penalty;
        state.totalPointsAllTime -= penalty;
        state.penaltyLog = state.penaltyLog || [];
        state.penaltyLog.unshift({ date: dStr, habit: h.name, minutesDone, minMinutes: h.minMinutes, penalty });
        state.penaltyLog = state.penaltyLog.slice(0, 20);
      }
    }
  });
}

function runDailyPenaltyCheck() {
  const today = localDateStr();
  const last = state.lastPenaltyCheckDate || today;
  if (last >= today) return;
  let cursor = new Date(last + 'T00:00:00');
  cursor.setDate(cursor.getDate() + 1);
  while (localDateStr(cursor) < today) {
    applyPrimaryPenaltiesForDay(localDateStr(cursor));
    cursor.setDate(cursor.getDate() + 1);
  }
  state.lastPenaltyCheckDate = today;
  save();
}

function getHabitSecondsToday(habitId) {
  const today = localDateStr();
  const logged = (state.logs[today] && state.logs[today][habitId]) || 0;
  const start = state.activeTimers[habitId];
  const live = start ? Math.max(0, Math.floor((Date.now() - start) / 1000)) : 0;
  return logged + live;
}

function getHabitDisplaySeconds(habitId) {
  const start = state.activeTimers[habitId];
  return start ? Math.max(0, Math.floor((Date.now() - start) / 1000)) : 0;
}

function getNegativeSecondsToday(habitId) {
  const today = localDateStr();
  const logged = (state.negativeLogs[today] && state.negativeLogs[today][habitId]) || 0;
  const start = state.activeTimers[habitId];
  const live = start ? Math.max(0, Math.floor((Date.now() - start) / 1000)) : 0;
  return logged + live;
}

/* صافي وقت اليوم = وقت العادات الإيجابية - وقت العادات السلبية (ممكن يطلع بالسالب) */
function netSecondsToday() {
  const pos = state.habits.reduce((s, h) => s + getHabitSecondsToday(h.id), 0);
  const neg = state.negativeHabits.reduce((s, h) => s + getNegativeSecondsToday(h.id), 0);
  return pos - neg;
}

function startTimer(id) { state.activeTimers[id] = Date.now(); save(); render(); }

function stopTimer(id) {
  const start = state.activeTimers[id];
  if (!start) return;
  const elapsedSec = Math.max(0, Math.round((Date.now() - start) / 1000));
  const day = localDateStr();
  const posHabit = state.habits.find(h => h.id === id);
  const negHabit = state.negativeHabits.find(h => h.id === id);
  if (posHabit) {
    state.logs[day] = state.logs[day] || {};
    state.logs[day][id] = (state.logs[day][id] || 0) + elapsedSec;
    const pointsEarned = (elapsedSec / 60) * posHabit.rate;
    state.reward.pointBalance += pointsEarned;
    state.totalPointsAllTime += pointsEarned;
  } else if (negHabit) {
    state.negativeLogs[day] = state.negativeLogs[day] || {};
    state.negativeLogs[day][id] = (state.negativeLogs[day][id] || 0) + elapsedSec;
    const pointsLost = (elapsedSec / 60) * negHabit.rate;
    /* النقاط بتنزل تحت الصفر عادي — وأي نقاط بتكسبها بعدين بترفعها من جديد */
    state.reward.pointBalance -= pointsLost;
    state.totalPointsAllTime -= pointsLost;
  }
  delete state.activeTimers[id];
  save(); render();
}

function addHabit() {

  if (category === 'primary') {
    const minMinutes = parseFloat(document.getElementById('new-habit-min').value);

    habit.penalty = (!isNaN(penalty) && penalty >= 0) ? penalty : 400;
  }
  state.habits.push(habit);
  addingHabit = false;
  save(); render();
}

function convertPoints() {
  if (state.reward.pointBalance <= 0) return;
  const dollars = state.reward.pointBalance / state.reward.pointsPerDollar;
  state.reward.history.unshift({ date: localDateStr(), points: state.reward.pointBalance, dollars });
  state.reward.history = state.reward.history.slice(0, 12);
  state.reward.dollarBalance += dollars;
  state.reward.pointBalance = 0;
  save(); render();
}

function claimSecondary() {
  const cost = state.reward.secondaryAmount || 0;
  if (state.reward.dollarBalance < cost || cost <= 0) return;
  state.reward.dollarBalance -= cost;
  state.reward.secondaryHistory.unshift({ date: localDateStr(), name: state.reward.secondaryName, amount: cost });
  state.reward.secondaryHistory = state.reward.secondaryHistory.slice(0, 12);
  save(); render();
}

  if (secName) state.reward.secondaryName = secName;
  if (!isNaN(secAmount) && secAmount >= 0) state.reward.secondaryAmount = secAmount;

/* ---------- نقاط الخطة ---------- */
function planPointsForDate(dateStr) {
  let pts = 0;
  const done = state.plan && state.plan.done ? state.plan.done : {};
  Object.keys(done).forEach(day => {
    Object.keys(done[day]).forEach(tid => {
      const rec = done[day][tid];
      if (rec && rec.date === dateStr) pts += rec.pts || 0;
    });
  });
  return pts;
}

function pointsForDay(dateStr) {
  let pts = 0;
  state.habits.forEach(h => {
    const secs = (state.logs[dateStr] && state.logs[dateStr][h.id]) || 0;
    pts += (secs / 60) * h.rate;
  });
  state.negativeHabits.forEach(h => {
    const secs = (state.negativeLogs[dateStr] && state.negativeLogs[dateStr][h.id]) || 0;
    pts -= (secs / 60) * h.rate;
  });
  pts += planPointsForDate(dateStr);
  return pts;
}

function todayPointsLive() {
  let pts = pointsForDay(localDateStr());
  state.habits.forEach(h => {
    const start = state.activeTimers[h.id];
    if (start) pts += (Math.max(0, Math.floor((Date.now() - start) / 1000)) / 60) * h.rate;
  });
  state.negativeHabits.forEach(h => {
    const start = state.activeTimers[h.id];
    if (start) pts -= (Math.max(0, Math.floor((Date.now() - start) / 1000)) / 60) * h.rate;
  });
  return pts;
}

function saveDailyGoal() {
  const val = parseFloat(document.getElementById('daily-goal-input').value);
  if (!isNaN(val) && val > 0) state.reward.dailyGoalPoints = val;
  editingDailyGoal = false;
  save(); render();
}

function starsForPoints(pts) {
  const goal = state.reward.dailyGoalPoints || 50;
  const raw = (Math.max(0, pts) / goal) * 10;
  return Math.max(0, Math.min(10, Math.round(raw)));
}

function monthGrid(year, month) {
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
  return cells;
}

function renderMonthCalendar(year, month) {
  const monthName = new Intl.DateTimeFormat('ar', { month: 'long', year: 'numeric' }).format(new Date(year, month, 1));
  const cells = monthGrid(year, month);
  const weekdayLabels = ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
  const todayStr = localDateStr();
  const cellsHtml = cells.map(d => {
    if (!d) return `<div class="cal-cell empty-cell"></div>`;
    const dStr = localDateStr(d);
    if (dStr > todayStr) return `<div class="cal-cell"><span class="cal-day">${d.getDate()}</span></div>`;
    const pts = pointsForDay(dStr);
    if (pts < 0) {
      return `<div class="cal-cell minus"><span class="cal-day">${d.getDate()}</span><span class="cal-stars">${Math.round(pts)}</span></div>`;
    }
    const stars = starsForPoints(pts);
    const alpha = stars / 10;
    return `<div class="cal-cell" style="background:rgba(124,132,103,${(0.06 + alpha * 0.45).toFixed(2)})">
      <span class="cal-day">${d.getDate()}</span>
      <span class="cal-stars">★${stars}</span>
    </div>`;
  }).join('');
  return `
    <div class="month-block">
      <div class="month-title">${monthName}</div>
      <div class="cal-weekdays">${weekdayLabels.map(w => `<span>${w}</span>`).join('')}</div>
      <div class="cal-grid">${cellsHtml}</div>
    </div>`;
}

function buildWeekData(habitId) {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dStr = localDateStr(d);
    const secs = (state.logs[dStr] && state.logs[dStr][habitId]) || 0;
    const isToday = dStr === localDateStr();
    days.push({
      dStr,
      label: isToday ? 'اليوم' : new Intl.DateTimeFormat('ar', { weekday: 'short' }).format(d),
      minutes: Math.round((secs / 60) * 10) / 10,
    });
  }
  return days;
}

function lineChartSVG(days, color) {
  const w = 320, h = 160, padL = 34, padR = 10, padT = 14, padB = 26;
  const maxVal = Math.max(5, ...days.map(d => d.minutes));
  const stepX = (w - padL - padR) / (days.length - 1);
  const scaleY = (h - padT - padB) / maxVal;
  const points = days.map((d, i) => ({ x: padL + i * stepX, y: h - padB - d.minutes * scaleY, ...d }));
  const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const gridLines = [0, 0.5, 1].map(f => {
    const y = h - padB - f * maxVal * scaleY;
    const val = Math.round(f * maxVal);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" style="stroke:var(--border);stroke-width:1" />
            <text x="${padL - 6}" y="${(y + 3).toFixed(1)}" font-size="8" style="fill:var(--text-muted)" text-anchor="end">${val}د</text>`;
  }).join('');
  const dots = points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" fill="${color}" />`).join('');
  const valueLabels = points.map(p => p.minutes > 0
    ? `<text x="${p.x.toFixed(1)}" y="${(p.y - 8).toFixed(1)}" font-size="8" style="fill:${color}" text-anchor="middle" font-weight="700">${p.minutes}</text>`
    : '').join('');
  const xLabels = points.map(p => `<text x="${p.x.toFixed(1)}" y="${h - 8}" font-size="9" style="fill:var(--text-muted)" text-anchor="middle">${p.label}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; direction:ltr;">
    ${gridLines}
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
    ${dots}
    ${valueLabels}
    ${xLabels}
  </svg>`;
}

function requestNotifPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') Notification.requestPermission().then(() => render());
}

function notifStatusText() {
  if (!('Notification' in window)) return 'المتصفح لا يدعم التنبيهات';
  if (Notification.permission === 'granted') return 'مفعّلة ✅';
  if (Notification.permission === 'denied') return 'مرفوضة من المتصفح — فعّلها من إعدادات الموقع';
  return 'غير مفعّلة';
}

function checkGoalNotifications() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const today = localDateStr();
  let changed = false;
  state.goals.forEach(g => {
    if (g.time === hhmm && g.lastNotifiedDate !== today) {
      try { new Notification('تذكير بعادة 🎯', { body: `حان وقت: ${g.habit} في ${g.place}` }); } catch (e) {}
      g.lastNotifiedDate = today;
      changed = true;
    }
  });
  if (changed) save();
}

function updateLiveNumbers() {
  if (activeTab !== 'habits') return;

  const todayTotalEl = document.getElementById('today-total-time');
  if (todayTotalEl) {
    const net = netSecondsToday();
    todayTotalEl.textContent = formatDuration(net);
    todayTotalEl.classList.toggle('neg', net < 0);
  }
  const pointsEl = document.getElementById('today-points-value');
  if (pointsEl) {
    const p = Math.round(todayPointsLive());
    pointsEl.textContent = p;
    pointsEl.classList.toggle('neg', p < 0);
  }

  state.habits.forEach(h => {
    const timeEl = document.getElementById(`habit-time-${h.id}`);
    if (timeEl) timeEl.textContent = formatDuration(getHabitDisplaySeconds(h.id));
    if (h.category === 'primary') {
      const doneMin = getHabitSecondsToday(h.id) / 60;
      const minMin = h.minMinutes || 0;
      const pct = minMin > 0 ? Math.min(100, (doneMin / minMin) * 100) : 100;
      const met = minMin > 0 ? doneMin >= minMin : true;
      const remain = Math.max(0, minMin - doneMin);
      const fillEl = document.getElementById(`progress-fill-${h.id}`);
      if (fillEl) { fillEl.style.width = pct + '%'; fillEl.style.background = met ? 'var(--teal)' : 'var(--gold)'; }
      const noteEl = document.getElementById(`progress-note-${h.id}`);
      if (noteEl) noteEl.textContent = met
        ? `حققت الحد الأدنى (${Math.round(minMin)} د) اليوم`
        : `— باقي ${Math.ceil(remain)} د لتفادي خصم ${Math.round(h.penalty)} نقطة (الحد الأدنى ${Math.round(minMin)} د/يوم)`;
    }
  });

  state.negativeHabits.forEach(h => {
    const timeEl = document.getElementById(`habit-time-${h.id}`);
    if (timeEl) timeEl.textContent = formatDuration(getHabitDisplaySeconds(h.id));
    const rateEl = document.getElementById(`neg-rate-${h.id}`);
    if (rateEl) rateEl.textContent = `-${h.rate} نقطة/دقيقة ${h.type === 'temporary' ? 'تنحذف بعد ٢٤س' : ''} · اليوم: -${formatDuration(getNegativeSecondsToday(h.id))}`;
  });
}

/* ---------- تبويب خطة الـ٩٠ يوم ---------- */
function planCurrentDay() {
  if (!state.plan.startDate) return 1;
  const n = daysBetween(state.plan.startDate, localDateStr()) + 1;
  return Math.max(1, Math.min(90, n));
}

function planTotals() {
  let total = 0, done = 0;
  for (let d = 1; d <= 90; d++) {
    const { anchors, tasks } = planTasksFor(d);
    total += anchors.length + tasks.length;
    const rec = state.plan.done[d] || {};
    done += Object.keys(rec).length;
  }
  return { total, done };
}

function togglePlanTask(day, tid, pts) {
  state.plan.done[day] = state.plan.done[day] || {};
  const rec = state.plan.done[day];
  if (rec[tid]) {
    state.reward.pointBalance -= rec[tid].pts || 0;
    state.totalPointsAllTime -= rec[tid].pts || 0;
    delete rec[tid];
    if (Object.keys(rec).length === 0) delete state.plan.done[day];
  } else {
    rec[tid] = { date: localDateStr(), pts };
    state.reward.pointBalance += pts;
    state.totalPointsAllTime += pts;
  }
  save(); render();
}

function startPlan() {
  state.plan.startDate = localDateStr();
  planViewDay = null;
  save(); render();
}

function renderPlanTab() {
  if (!state.plan.startDate) {
    return `
      <div class="page-title">خطة ٩٠ يوم — أكاديمية التداول</div>
      <div class="card">
        <div class="b-title" style="font-family:var(--serif); font-size:17px; margin-bottom:8px;">من موقع جاهز… إلى مصدر دخل فعلي</div>
        <div style="color:var(--text-muted); font-size:14px; line-height:1.9; margin-bottom:18px;">
          كل يوم مقسوم لمهام صغيرة تقدر تخلصها وحدة وحدة، وكل مهمة بتضيف نقاط لرصيد المكافأة.
          لو تأخرت يوم أو يومين، كمّل من وين وقفت — التقدّم محفوظ حسب اليوم مش حسب التاريخ.
        </div>
        <button class="btn-solid" data-action="start-plan">ابدأ الخطة من اليوم</button>
      </div>`;
  }

  const today = planCurrentDay();
  const day = planViewDay || today;
  const month = planMonthOf(day);
  const week = planWeekOf(day);
  const { focus, anchors, tasks } = planTasksFor(day);
  const doneRec = state.plan.done[day] || {};
  const all = [...anchors.map(a => ({ ...a, group: 'anchor' })), ...tasks.map(t => ({ ...t, group: 'task' }))];
  const dayDone = all.filter(x => doneRec[x.id]).length;
  const dayPts = all.reduce((s, x) => s + (doneRec[x.id] ? x.pts : 0), 0);
  const dayMaxPts = all.reduce((s, x) => s + x.pts, 0);
  const totals = planTotals();
  const overallPct = Math.round((totals.done / totals.total) * 100);

  const strip = Array.from({ length: 90 }, (_, i) => {
    const d = i + 1;
    const rec = state.plan.done[d] || {};
    const { anchors: a, tasks: t } = planTasksFor(d);
    const full = Object.keys(rec).length >= (a.length + t.length);
    const cls = d === day ? 'now' : (full ? 'on' : '');
    return `<span class="${cls}"></span>`;
  }).join('');

  const rowHtml = (x) => `
    <div class="task-row ${doneRec[x.id] ? 'done' : ''}" data-action="toggle-task" data-day="${day}" data-tid="${x.id}" data-pts="${x.pts}">
      <span class="task-box">${doneRec[x.id] ? '✓' : ''}</span>
      <span class="task-text">${x.text}</span>
      <span class="task-pts">+${x.pts}</span>
    </div>`;

  return `
    <div class="plan-head">
      <div>
        <div class="plan-daynum">اليوم ${day}<small>من ٩٠</small></div>
        <div class="plan-meta" style="margin-top:10px;">
          <span>الشهر ${month.n}</span>
          <span>الأسبوع ${week.n} — ${week.title}</span>
        </div>
      </div>
      <div class="plan-phase">
        <b>${month.title.split('—')[1] ? month.title.split('—')[1].trim() : month.title}</b>
        ${month.goal}
      </div>
    </div>

    <div class="plan-nav" style="margin-bottom:16px;">
      <button data-action="plan-prev" ${day <= 1 ? 'disabled' : ''}>اليوم السابق</button>
      <button data-action="plan-today">ارجع لليوم ${today}</button>
      <button data-action="plan-next" ${day >= 90 ? 'disabled' : ''}>اليوم التالي</button>
    </div>

    <div class="phase-strip">${strip}</div>

    <div class="day-flag">
      <b>تركيز اليوم: ${focus}</b>
      أنجزت ${dayDone} من ${all.length} مهمة اليوم · ${Math.round(dayPts)} نقطة من ${dayMaxPts} · تقدّم الخطة كامل ${overallPct}%
    </div>

    <div class="sub-heading">ثوابت يومية</div>
    <div>${anchors.map(a => rowHtml({ ...a })).join('')}</div>

    <div class="sub-heading">مهام اليوم ${day}</div>
    <div>${tasks.length ? tasks.map(t => rowHtml({ ...t })).join('') : '<div class="empty">ما في مهام محددة لهذا اليوم.</div>'}</div>
  `;
}

      <div class="h-title">سجل التحويلات</div>
      ${r.history.map(e => `
        <div class="h-item"><span class="d">${e.date}</span><span>${Math.round(e.points)} نقطة → $${e.dollars.toFixed(2)}</span></div>
      `).join('')}
    </div>` : '';

  const secHistoryHtml = r.secondaryHistory.length > 0 ? `
    <div class="history">
      <div class="h-title">مكافآت صغيرة استلمتها</div>
      ${r.secondaryHistory.map(e => `
        <div class="h-item"><span class="d">${e.date}</span><span>${e.name} — $${e.amount}</span></div>
      `).join('')}
    </div>` : '';

  const rewardBodyHtml = editingReward ? `
    <div class="field" style="margin-bottom:12px;">
      <label>اسم المكافأة الرئيسية</label>
      <input id="reward-goal-name" value="${r.goalName}" />
    </div>
    <div style="display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
      <div class="field">
        <label>المبلغ المستهدف ($)</label>
        <input id="reward-target" type="number" value="${r.targetAmount}" />
      </div>
      <div class="field">
        <label>نقطة مقابل الدولار</label>
        <input id="reward-rate" type="number" value="${r.pointsPerDollar}" />
      </div>
      <div class="field">
        <label>هدف نقاط اليوم (لـ ١٠ نجوم)</label>
        <input id="reward-daily-goal" type="number" value="${r.dailyGoalPoints}" />
      </div>
    </div>
    <div style="display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
      <div class="field">
        <label>اسم المكافأة الثانوية (القريبة)</label>
        <input id="reward-sec-name" value="${r.secondaryName}" />
      </div>
      <div class="field">
        <label>سعرها ($)</label>
        <input id="reward-sec-amount" type="number" value="${r.secondaryAmount}" />
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-solid" data-action="save-reward">حفظ</button>
      <button class="btn-outline" data-action="cancel-reward">إلغاء</button>
    </div>
  ` : `
    <div class="reward-top">
      <div>
        <div class="points-label" style="margin-bottom:4px;">المكافأة الرئيسية</div>
        <div class="reward-goal">${r.goalName}</div>
      </div>
      <span class="points-label">$${r.dollarBalance.toFixed(2)} / $${r.targetAmount}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    <div class="points-row">
      <div>
        <div class="points-label">رصيد النقاط الحالي</div>
        <div class="points-value ${r.pointBalance < 0 ? 'neg' : ''}">${Math.round(r.pointBalance)}</div>
        <div class="points-est">${r.pointBalance >= 0
          ? `≈ $${(r.pointBalance / r.pointsPerDollar).toFixed(2)} عند التحويل`
          : `رصيدك بالسالب — كل نقطة بتكسبها بترفعه لفوق قبل ما يصير دولارات`}</div>
      </div>
      <button class="btn-teal" data-action="convert" ${r.pointBalance <= 0 ? 'disabled' : ''}>تحويل إلى دولارات</button>
    </div>
    ${historyHtml}
  `;

  const secondaryHtml = `
    <div class="reward-top">
      <div>
        <div class="points-label" style="margin-bottom:4px;">المكافأة الثانوية — القريبة</div>
        <div class="reward-goal">${r.secondaryName}</div>
      </div>
      <span class="points-label">$${r.dollarBalance.toFixed(2)} / $${r.secondaryAmount}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${secPct}%; background:var(--teal)"></div></div>
    <div class="points-row">
      <div class="penalty-note" style="max-width:420px; line-height:1.7;">
        ${secReady
          ? 'جاهزة — استلمها ورصيدك بينخصم منه سعرها، وبعدها حدد مكافأة قريبة جديدة.'
          : `باقي $${Math.max(0, r.secondaryAmount - r.dollarBalance).toFixed(2)} لتوصلها. هدف قريب بيخليك تشوف نتيجة قبل المكافأة الكبيرة.`}
      </div>
      <button class="btn-teal" data-action="claim-secondary" ${secReady ? '' : 'disabled'}>استلمت المكافأة</button>
    </div>
    ${secHistoryHtml}
  `;

  return `
    <div class="section">
      <div class="row-between">
        <div class="page-title" style="margin:0;">المكافأة</div>
        ${!editingReward ? `<button class="muted-btn" data-action="edit-reward">✎ تعديل</button>` : ''}
      </div>
      <div class="card">${rewardBodyHtml}</div>
      ${!editingReward ? `<div class="card" style="margin-top:18px;">${secondaryHtml}</div>` : ''}
    </div>
  `;
}

function render() {
  pruneTemporary();
  runDailyPenaltyCheck();
  const app = document.getElementById('app');

  const tabbarHtml = `
    <div class="tabbar">
      ${TABS.map((t, i) => `
        <button class="tab-btn ${activeTab === t.id ? 'active' : ''}" data-action="switch-tab" data-tab="${t.id}">
          <span class="tab-index">${pad(i + 1)}</span>${t.label}
        </button>`).join('')}
    </div>`;

  let contentHtml = '';
  if (activeTab === 'habits') contentHtml = renderHabitsTab();
  else if (activeTab === 'plan') contentHtml = renderPlanTab();
  else if (activeTab === 'streaks') contentHtml = renderStreaksTab();
  else if (activeTab === 'calendar') contentHtml = renderCalendarTab();
  else if (activeTab === 'goals') contentHtml = renderGoalsTab();
  else if (activeTab === 'reward') contentHtml = renderRewardTab();

  app.innerHTML = `
    <div class="wrap">
      ${tabbarHtml}
      ${contentHtml}
    </div>
  `;
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (action === 'switch-tab') { activeTab = btn.dataset.tab; render(); }
  else if (action === 'start') startTimer(id);
  else if (action === 'stop') stopTimer(id);
  else if (action === 'delete') deleteHabit(id);
  else if (action === 'toggle-add') { addingHabit = !addingHabit; render(); }
  else if (action === 'save-add-habit') addHabit();
  else if (action === 'toggle-add-negative') { addingNegative = !addingNegative; render(); }
  else if (action === 'save-add-negative') addNegativeHabit();
  else if (action === 'delete-negative') deleteNegativeHabit(id);
  else if (action === 'convert') convertPoints();
  else if (action === 'claim-secondary') claimSecondary();
  else if (action === 'edit-reward') { editingReward = true; render(); }
  else if (action === 'save-reward') saveRewardEdit();
  else if (action === 'cancel-reward') { editingReward = false; render(); }
  else if (action === 'save-goal') addGoal();
  else if (action === 'delete-goal') deleteGoal(id);
  else if (action === 'enable-notif') requestNotifPermission();
  else if (action === 'edit-daily-goal') { editingDailyGoal = true; render(); }
  else if (action === 'save-daily-goal') saveDailyGoal();
  else if (action === 'cancel-daily-goal') { editingDailyGoal = false; render(); }
  else if (action === 'start-plan') startPlan();
  else if (action === 'plan-prev') { planViewDay = Math.max(1, (planViewDay || planCurrentDay()) - 1); render(); }
  else if (action === 'plan-next') { planViewDay = Math.min(90, (planViewDay || planCurrentDay()) + 1); render(); }
  else if (action === 'plan-today') { planViewDay = null; render(); }
  else if (action === 'toggle-task') togglePlanTask(parseInt(btn.dataset.day, 10), btn.dataset.tid, parseFloat(btn.dataset.pts));
});

setInterval(() => {
  checkGoalNotifications();
  updateLiveNumbers();
}, 1000);

render();

</script>
</body>
</html>
